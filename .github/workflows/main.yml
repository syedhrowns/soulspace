name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build site
        env:
          EXPORT_STATIC: 'true'
          GITHUB_PAGES: 'true'
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Prepare export directory
        run: |
          TARGET="out"
          if [ ! -d "$TARGET" ]; then
            TARGET="dist"
          fi
          touch "$TARGET/.nojekyll"
          if [ -f "public/404.html" ] && [ ! -f "$TARGET/404.html" ]; then
            cp "public/404.html" "$TARGET/404.html"
          fi
          echo "OUTPUT_DIR=$TARGET" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTPUT_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
